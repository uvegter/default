<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pointless — Vegter 25th Anniversary Edition</title>
<style>
  :root {
    --bg: #050608;
    --bg-2: #0b0e14;
    --panel: rgba(255, 255, 255, 0.035);
    --panel-border: rgba(212, 175, 55, 0.22);
    --gold: #d4af37;
    --gold-bright: #ffe17a;
    --ink: #f4f1e6;
    --muted: #8a8f9c;
    --red: #e23b3b;
    --orange: #ef8a2b;
    --green: #29c46a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 800px at 50% -20%, #16203a 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 120%, #1a1230 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-2), var(--bg));
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* spotlight sweep */
  body::before {
    content: "";
    position: fixed;
    inset: -40%;
    background: conic-gradient(from 0deg at 50% 0%, transparent 0deg, rgba(212,175,55,0.05) 18deg, transparent 36deg);
    pointer-events: none;
    animation: sweep 22s linear infinite;
    z-index: 0;
  }
  @keyframes sweep { to { transform: rotate(360deg); } }

  header {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 20px 34px 16px;
    border-bottom: 1px solid var(--panel-border);
    background: linear-gradient(180deg, rgba(0,0,0,0.4), transparent);
  }
  header h1 {
    margin: 0;
    font-size: clamp(28px, 4.4vw, 52px);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    font-weight: 800;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, #8a6d1f);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 30px rgba(212,175,55,0.25);
  }
  header .sub {
    display: block;
    margin-top: 8px;
    color: var(--muted);
    font-size: clamp(11px, 1.4vw, 15px);
    letter-spacing: 0.32em;
    text-transform: uppercase;
  }

  select, button, input {
    font-family: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 13px 15px;
    font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s, transform .08s;
  }
  select { cursor: pointer; width: 100%; }
  select:focus, input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.15); }

  button { cursor: pointer; letter-spacing: 0.06em; }
  button:hover { border-color: var(--gold); background: rgba(212,175,55,0.1); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #2a2207;
    border: none;
    font-weight: 700;
  }
  button.primary:hover { filter: brightness(1.06); }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: grid;
    grid-template-columns: 350px 1fr 350px;
    gap: 26px;
    padding: 28px 34px 34px;
    min-height: 0;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35) inset, 0 1px 0 rgba(255,255,255,0.04);
  }

  .plabel {
    color: var(--gold);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: 12px;
    margin-bottom: 12px;
  }

  /* ---- LEFT: question + answer ---- */
  .qcat { color: var(--muted); letter-spacing: 0.24em; text-transform: uppercase; font-size: 11px; margin: 18px 0 8px; }
  .qtext {
    font-size: clamp(19px, 1.8vw, 26px);
    line-height: 1.3;
    font-weight: 600;
    margin: 0;
    flex: 1;
  }
  .qsurvey { color: var(--muted); font-size: 12px; margin: 14px 0 18px; font-style: italic; }
  .answerRow { display: flex; flex-direction: column; gap: 10px; }
  #answerInput { font-size: 18px; padding: 15px 18px; text-transform: uppercase; letter-spacing: 0.02em; }
  #answerInput::placeholder { text-transform: none; letter-spacing: normal; }
  #answerInput:disabled { opacity: 0.5; }

  /* ---- CENTER: vertical bar chart ---- */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .bigScore {
    font-size: clamp(64px, 10vw, 128px);
    font-weight: 800;
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
    margin-bottom: 18px;
    background: linear-gradient(180deg, #fff, #cfd3dc 60%, #8a8f9c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: filter .2s;
  }
  .chart {
    display: flex;
    gap: 16px;
    align-items: stretch;
    height: min(56vh, 520px);
  }
  .barTrack {
    position: relative;
    width: clamp(90px, 10vw, 150px);
    border-radius: 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.09);
    overflow: hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
  }
  .barFill {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 100%;
    background: var(--red);
    border-radius: 16px 16px 0 0;
    transition: background-color .25s linear;
  }
  .barFill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0.22), transparent 40%);
    pointer-events: none;
  }
  .scale {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-align: left;
    padding: 2px 0;
  }
  .scale .zero { color: var(--gold); font-weight: 700; }
  .verdict {
    margin-top: 22px;
    min-height: 26px;
    font-size: 15px;
    text-align: center;
    max-width: 420px;
  }
  .verdict .good { color: var(--green); }
  .verdict .meh { color: var(--orange); }
  .verdict .bad { color: var(--red); }
  .verdict .accepted { color: var(--gold-bright); font-weight: 700; }
  .statusLine { color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; font-size: 12px; margin-bottom: 6px; height: 16px; }

  /* ---- RIGHT: round guesses ---- */
  .log { flex: 1; overflow-y: auto; min-height: 0; margin: 4px -6px 16px; padding: 0 6px; }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.25); border-radius: 8px; }
  .entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 13px;
    border-radius: 10px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.05);
    animation: slidein .3s ease;
  }
  @keyframes slidein { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .entry .ans { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .ans small { display: block; color: var(--muted); font-size: 11px; }
  .entry .pts { font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
  .entry.zero { border-color: var(--gold); background: rgba(212,175,55,0.08); }
  .entry.zero .pts { color: var(--gold-bright); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 10px; }
  #resetBtn { width: 100%; }

  /* POINTLESS overlay */
  .pointless {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: radial-gradient(circle at 50% 50%, rgba(212,175,55,0.16), rgba(0,0,0,0.86) 60%);
    backdrop-filter: blur(3px);
  }
  .pointless.show { display: flex; animation: fadein .3s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .pointless h2 {
    font-size: clamp(48px, 13vw, 170px);
    letter-spacing: 0.16em;
    margin: 0;
    font-weight: 900;
    text-transform: uppercase;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, #7a5f17);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 60px rgba(212,175,55,0.5);
    animation: pop .6s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pointless p { color: var(--gold-bright); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 8px; }
  .pointless small { color: var(--muted); margin-top: 24px; letter-spacing: 0.2em; }

  .loading, .errbox { margin: auto; text-align: center; color: var(--muted); z-index: 2; }
  .errbox { color: var(--red); max-width: 540px; line-height: 1.5; }
  .errbox code { color: var(--gold); }

  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; grid-auto-rows: min-content; overflow-y: auto; }
    .chart { height: 40vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Pointless</h1>
  <span class="sub">Vegter 25th Anniversary Edition</span>
</header>

<main id="app" style="display:none">

  <!-- LEFT: question + answer -->
  <section class="panel">
    <div class="plabel">The question</div>
    <select id="questionSelect" aria-label="Choose a question"></select>
    <div class="qcat" id="qCat"></div>
    <p class="qtext" id="qText"></p>
    <div class="qsurvey" id="qSurvey"></div>
    <div class="answerRow">
      <input id="answerInput" type="text" placeholder="Type your answer…" autocomplete="off" />
      <button id="submitBtn" class="primary">Lock it in</button>
    </div>
  </section>

  <!-- CENTER: vertical bar chart -->
  <section class="stage">
    <div class="statusLine" id="statusLine">Awaiting your answer</div>
    <div class="bigScore" id="bigScore">100</div>
    <div class="chart">
      <div class="barTrack"><div class="barFill" id="barFill"></div></div>
      <div class="scale">
        <span>100</span>
        <span>50</span>
        <span class="zero">0 · POINTLESS</span>
      </div>
    </div>
    <div class="verdict" id="verdict"></div>
  </section>

  <!-- RIGHT: this round's guesses -->
  <section class="panel">
    <div class="plabel">This round</div>
    <div class="log" id="log">
      <div class="empty">No answers yet.<br />The hunt for a pointless answer begins…</div>
    </div>
    <button id="resetBtn">⟲ Reset round</button>
  </section>

</main>

<div class="loading" id="loading">Loading question database…</div>

<div class="pointless" id="pointlessOverlay">
  <h2>Pointless!</h2>
  <p>A perfect answer</p>
  <small id="pointlessSub">Nobody said it. Click anywhere to continue.</small>
</div>

<script>
"use strict";

const state = {
  db: null,
  currentQ: null,
  answered: new Set(),
  round: [],
  animating: false,
};

/* ---------- Fuzzy matching ---------- */
function normalize(str) {
  return str
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "") // strip accents
    .replace(/[^a-z0-9 ]/g, " ")
    .replace(/\b(the|a|an|of|and|st|saint)\b/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function levenshtein(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let cur = [i];
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
    }
    prev = cur;
  }
  return prev[b.length];
}

// Return the best matching answer object, or null.
function fuzzyMatch(input, question) {
  const q = normalize(input);
  if (!q) return null;
  let best = null;
  let bestDist = Infinity;

  for (const ans of question.answers) {
    const candidates = [ans.answer, ...(ans.aliases || [])];
    for (const cand of candidates) {
      const c = normalize(cand);
      if (!c) continue;
      let dist;
      if (c === q) dist = 0;
      // any typed term contained in the answer (or vice-versa) counts, e.g. "monet" -> "Claude Monet".
      // require >= 3 chars so stray letters don't match everything.
      else if (q.length >= 3 && (c.includes(q) || q.includes(c))) dist = 1;
      else dist = levenshtein(q, c);

      const tolerance = Math.max(1, Math.floor(c.length * 0.34));
      if (dist <= tolerance && dist < bestDist) {
        bestDist = dist;
        best = ans;
      }
    }
  }
  return best;
}

/* ---------- Countdown animation ---------- */
const RED = [226, 59, 59], ORANGE = [239, 138, 43], GREEN = [41, 196, 106], GOLD = [255, 225, 122];
function lerp(a, b, t) { return a + (b - a) * t; }
function mix(c1, c2, t) {
  return `rgb(${Math.round(lerp(c1[0], c2[0], t))},${Math.round(lerp(c1[1], c2[1], t))},${Math.round(lerp(c1[2], c2[2], t))})`;
}
// color from 100 -> 0: red -> orange -> green, pure gold exactly at 0
function colorFor(value) {
  if (value <= 0.0001) return `rgb(${GOLD.join(",")})`;
  const v = Math.max(0, Math.min(100, value));
  if (v > 50) return mix(ORANGE, RED, (v - 50) / 50);
  return mix(GREEN, ORANGE, v / 50);
}

function setBoard(value) {
  const v = Math.max(0, value);
  document.getElementById("bigScore").textContent = Math.round(v);
  const fill = document.getElementById("barFill");
  fill.style.height = v + "%";
  fill.style.backgroundColor = colorFor(v);
}

// ease-out so the number decelerates as it drops toward the final score
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function animateCountdown(target) {
  return new Promise((resolve) => {
    state.animating = true;
    const start = 100;
    const duration = 1600 + (start - target) * 28; // ~1.6s .. ~4.4s (bigger drops take longer)
    let startTs = null;
    function frame(ts) {
      if (startTs === null) startTs = ts;
      const t = Math.min(1, (ts - startTs) / duration);
      const value = start - (start - target) * easeOutCubic(t);
      setBoard(value);
      if (t < 1) requestAnimationFrame(frame);
      else { setBoard(target); state.animating = false; resolve(); }
    }
    requestAnimationFrame(frame);
  });
}

/* ---------- Rendering ---------- */
function loadQuestion(q) {
  state.currentQ = q;
  state.answered = new Set();
  state.round = [];
  document.getElementById("qCat").textContent = q.category || "General Knowledge";
  document.getElementById("qText").textContent = q.question;
  document.getElementById("qSurvey").textContent = state.db.surveyNote || "";
  document.getElementById("bigScore").style.filter = "";
  setBoard(100);
  renderLog();
  const input = document.getElementById("answerInput");
  input.value = "";
  input.disabled = false;
  input.focus();
  document.getElementById("statusLine").textContent = "Awaiting your answer";
  document.getElementById("verdict").innerHTML = "";
}

function renderLog() {
  const log = document.getElementById("log");
  if (!state.round.length) {
    log.innerHTML = '<div class="empty">No answers yet.<br />The hunt for a pointless answer begins…</div>';
    return;
  }
  log.innerHTML = "";
  for (let i = state.round.length - 1; i >= 0; i--) { // newest first
    const e = state.round[i];
    const div = document.createElement("div");
    div.className = "entry" + (e.zero ? " zero" : "");
    div.innerHTML =
      '<div class="ans">' + escapeHtml(e.display) +
      (e.note ? '<small>' + escapeHtml(e.note) + '</small>' : '') +
      '</div><div class="pts">' + e.score + '</div>';
    log.appendChild(div);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- Submit flow ---------- */
async function submitAnswer() {
  if (state.animating) return;
  const input = document.getElementById("answerInput");
  const raw = input.value.trim();
  const verdict = document.getElementById("verdict");
  const status = document.getElementById("statusLine");
  if (!raw) return;

  const match = fuzzyMatch(raw, state.currentQ);

  if (!match) {
    setBoard(100);
    verdict.innerHTML = '<span class="bad">✗ “' + escapeHtml(raw) + '” isn\'t on our board — that\'s the maximum 100.</span>';
    status.textContent = "Not on the board";
    flashScore();
    input.select();
    return;
  }
  if (state.answered.has(match.answer)) {
    verdict.innerHTML = '<span class="meh">“' + escapeHtml(match.answer) + '” is already on the board this round.</span>';
    status.textContent = "Already given";
    input.select();
    return;
  }

  input.disabled = true;
  document.getElementById("submitBtn").disabled = true;
  status.textContent = "Counting down…";
  verdict.innerHTML = '<span class="accepted">✓ ' + escapeHtml(match.answer) + '</span>' +
    (match.note ? ' <span style="color:var(--muted)">— ' + escapeHtml(match.note) + '</span>' : '');

  await animateCountdown(match.score);

  const fill = document.getElementById("barFill");
  if (match.score === 0) {
    fill.style.backgroundColor = `rgb(${GOLD.join(",")})`;
    document.getElementById("bigScore").style.filter = "drop-shadow(0 0 20px rgba(212,175,55,.7))";
    showPointless(match);
  } else {
    document.getElementById("bigScore").style.filter = "";
  }

  state.answered.add(match.answer);
  state.round.push({ display: match.answer, note: match.note || "", score: match.score, zero: match.score === 0 });
  renderLog();

  if (match.score === 0) status.textContent = "POINTLESS!";
  else if (match.score <= 15) { status.textContent = "Great answer"; verdict.innerHTML += ' <span class="good">— a really low score!</span>'; }
  else if (match.score <= 45) { status.textContent = "Solid"; verdict.innerHTML += ' <span class="meh">— middling.</span>'; }
  else { status.textContent = "Ouch"; verdict.innerHTML += ' <span class="bad">— a high, popular answer.</span>'; }

  input.disabled = false;
  document.getElementById("submitBtn").disabled = false;
  input.value = "";
  input.focus();
}

function flashScore() {
  const el = document.getElementById("bigScore");
  el.style.transition = "none";
  el.style.webkitTextFillColor = "var(--red)";
  setTimeout(() => { el.style.webkitTextFillColor = ""; el.style.transition = ""; }, 350);
}

function showPointless(match) {
  const overlay = document.getElementById("pointlessOverlay");
  document.getElementById("pointlessSub").textContent =
    (match.note ? match.note + " — n" : "N") + "obody said it. Click anywhere to continue.";
  overlay.classList.add("show");
}

/* ---------- Wiring ---------- */
function populateSelect() {
  const sel = document.getElementById("questionSelect");
  sel.innerHTML = "";
  state.db.questions.forEach((q, i) => {
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = (q.category ? q.category + " — " : "") +
      (q.question.length > 52 ? q.question.slice(0, 49) + "…" : q.question);
    sel.appendChild(opt);
  });
  sel.addEventListener("change", () => loadQuestion(state.db.questions[Number(sel.value)]));
}

function resetRound() { if (state.currentQ) loadQuestion(state.currentQ); }

function wireEvents() {
  document.getElementById("submitBtn").addEventListener("click", submitAnswer);
  document.getElementById("answerInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); submitAnswer(); }
  });
  document.getElementById("resetBtn").addEventListener("click", resetRound);
  const overlay = document.getElementById("pointlessOverlay");
  overlay.addEventListener("click", () => overlay.classList.remove("show"));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") overlay.classList.remove("show"); });
}

/* ---------- Boot ---------- */
async function boot() {
  try {
    const res = await fetch("database.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const db = await res.json();
    if (!db.questions || !db.questions.length) throw new Error("No questions in database.");
    state.db = db;
    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "grid";
    populateSelect();
    wireEvents();
    loadQuestion(db.questions[0]);
  } catch (err) {
    const loading = document.getElementById("loading");
    loading.className = "errbox";
    loading.innerHTML =
      "<strong>Couldn't load <code>database.json</code></strong><br/><br/>" +
      escapeHtml(err.message) +
      "<br/><br/>This app loads its questions from a separate file, so it must be served over HTTP " +
      "(opening the file directly with <code>file://</code> blocks the fetch). Try:<br/><br/>" +
      "<code>python3 -m http.server</code><br/>then open <code>http://localhost:8000</code>.";
  }
}

boot();
</script>
</body>
</html>
