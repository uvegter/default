<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pointless</title>
<style>
  :root {
    --bg: #050608;
    --bg-2: #0b0e14;
    --panel: rgba(255, 255, 255, 0.035);
    --panel-border: rgba(212, 175, 55, 0.22);
    --gold: #d4af37;
    --gold-bright: #ffe17a;
    --ink: #f4f1e6;
    --muted: #8a8f9c;
    --red: #e23b3b;
    --orange: #ef8a2b;
    --green: #29c46a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 800px at 50% -20%, #16203a 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 120%, #1a1230 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-2), var(--bg));
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* spotlight sweep */
  body::before {
    content: "";
    position: fixed;
    inset: -40%;
    background: conic-gradient(from 0deg at 50% 0%, transparent 0deg, rgba(212,175,55,0.05) 18deg, transparent 36deg);
    pointer-events: none;
    animation: sweep 22s linear infinite;
    z-index: 0;
  }
  @keyframes sweep { to { transform: rotate(360deg); } }

  header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 34px;
    border-bottom: 1px solid var(--panel-border);
    background: linear-gradient(180deg, rgba(0,0,0,0.4), transparent);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .brand h1 {
    margin: 0;
    font-size: clamp(26px, 4vw, 46px);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    font-weight: 800;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, #8a6d1f);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 30px rgba(212,175,55,0.25);
  }
  .brand .tag {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
  }

  .controls { display: flex; align-items: center; gap: 12px; }

  select, button, input {
    font-family: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s, transform .08s;
  }
  select { min-width: 230px; cursor: pointer; }
  select:focus, input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.15); }

  button {
    cursor: pointer;
    letter-spacing: 0.06em;
  }
  button:hover { border-color: var(--gold); background: rgba(212,175,55,0.1); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #2a2207;
    border: none;
    font-weight: 700;
  }
  button.primary:hover { filter: brightness(1.06); }
  button.ghost { color: var(--muted); }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 26px;
    padding: 30px 34px 34px;
    min-height: 0;
  }

  .stage {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .qcard {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 26px 30px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45) inset, 0 1px 0 rgba(255,255,255,0.04);
  }
  .qcat {
    color: var(--gold);
    letter-spacing: 0.26em;
    text-transform: uppercase;
    font-size: 12px;
    margin-bottom: 10px;
  }
  .qtext {
    font-size: clamp(20px, 2.6vw, 30px);
    line-height: 1.28;
    font-weight: 600;
    margin: 0;
  }
  .qsurvey { color: var(--muted); font-size: 13px; margin-top: 12px; font-style: italic; }

  .answerRow {
    display: flex;
    gap: 12px;
    margin-top: 22px;
  }
  .answerRow input { flex: 1; font-size: 18px; padding: 15px 18px; text-transform: uppercase; letter-spacing: 0.02em; }
  .answerRow input::placeholder { text-transform: none; letter-spacing: normal; }
  .answerRow input:disabled { opacity: 0.5; }

  /* The big board */
  .board {
    margin-top: 26px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    min-height: 0;
  }

  .scoreWrap {
    position: relative;
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0.2));
    padding: 22px 26px;
    overflow: hidden;
  }

  .scoreHead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .scoreHead .label { color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; font-size: 12px; }
  .bigScore {
    font-size: clamp(56px, 12vw, 130px);
    font-weight: 800;
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #fff, #cfd3dc 60%, #8a8f9c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: filter .2s;
  }

  .barTrack {
    height: 34px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
    position: relative;
  }
  .barFill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: var(--red);
    box-shadow: 0 0 24px rgba(0,0,0,0.4);
    transition: background-color .25s linear;
  }
  .barFill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent 45%);
    pointer-events: none;
  }
  .barScale {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 11px;
    margin-top: 8px;
    letter-spacing: 0.1em;
  }

  .verdict {
    margin-top: 14px;
    min-height: 26px;
    font-size: 15px;
    color: var(--ink);
  }
  .verdict .good { color: var(--green); }
  .verdict .meh { color: var(--orange); }
  .verdict .bad { color: var(--red); }
  .verdict .accepted { color: var(--gold-bright); font-weight: 700; }

  /* POINTLESS overlay */
  .pointless {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: radial-gradient(circle at 50% 50%, rgba(212,175,55,0.16), rgba(0,0,0,0.86) 60%);
    backdrop-filter: blur(3px);
  }
  .pointless.show { display: flex; animation: fadein .3s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .pointless h2 {
    font-size: clamp(48px, 13vw, 170px);
    letter-spacing: 0.16em;
    margin: 0;
    font-weight: 900;
    text-transform: uppercase;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, #7a5f17);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 60px rgba(212,175,55,0.5);
    animation: pop .6s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pointless p { color: var(--gold-bright); letter-spacing: 0.3em; text-transform: uppercase; margin-top: 8px; }
  .pointless small { color: var(--muted); margin-top: 24px; letter-spacing: 0.2em; }

  /* Sidebar scoreboard */
  aside {
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 20px;
    min-height: 0;
  }
  aside h3 {
    margin: 0 0 4px;
    color: var(--gold);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 13px;
  }
  .roundTotal {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 6px 0 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--panel-border);
  }
  .roundTotal b { font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .roundTotal span { color: var(--muted); font-size: 12px; }

  .log { flex: 1; overflow-y: auto; min-height: 0; }
  .log::-webkit-scrollbar { width: 8px; }
  .log::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.25); border-radius: 8px; }

  .entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.05);
    animation: slidein .3s ease;
  }
  @keyframes slidein { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  .entry .ans { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry .ans small { display: block; color: var(--muted); font-size: 11px; }
  .entry .pts {
    font-weight: 800;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    min-width: 38px;
    text-align: right;
  }
  .entry.zero { border-color: var(--gold); background: rgba(212,175,55,0.08); }
  .entry.zero .pts { color: var(--gold-bright); }

  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 10px; }

  .loading, .errbox {
    margin: auto;
    text-align: center;
    color: var(--muted);
    z-index: 2;
  }
  .errbox { color: var(--red); max-width: 540px; line-height: 1.5; }
  .errbox code { color: var(--gold); }

  @media (max-width: 880px) {
    main { grid-template-columns: 1fr; }
    aside { max-height: 38vh; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Pointless</h1>
    <span class="tag">Studio Edition</span>
  </div>
  <div class="controls">
    <select id="questionSelect" aria-label="Choose a question"></select>
    <button id="resetBtn" class="ghost" title="Clear the scoreboard and start over">⟲ Reset round</button>
  </div>
</header>

<main id="app" style="display:none">
  <section class="stage">
    <div class="qcard">
      <div class="qcat" id="qCat"></div>
      <p class="qtext" id="qText"></p>
      <div class="qsurvey" id="qSurvey"></div>
      <div class="answerRow">
        <input id="answerInput" type="text" placeholder="Type your answer and press Enter…" autocomplete="off" />
        <button id="submitBtn" class="primary">Lock it in</button>
      </div>
    </div>

    <div class="board">
      <div class="scoreWrap">
        <div class="scoreHead">
          <span class="label">The board</span>
          <span class="label" id="statusLine">Awaiting your answer</span>
        </div>
        <div class="bigScore" id="bigScore">100</div>
        <div class="barTrack"><div class="barFill" id="barFill"></div></div>
        <div class="barScale"><span>0 — POINTLESS</span><span>50</span><span>100</span></div>
        <div class="verdict" id="verdict"></div>
      </div>
    </div>
  </section>

  <aside>
    <h3>This round</h3>
    <div class="roundTotal">
      <b id="roundTotal">0</b>
      <span>total points · lower is better</span>
    </div>
    <div class="log" id="log">
      <div class="empty">No answers yet.<br />The hunt for a pointless answer begins…</div>
    </div>
  </aside>
</main>

<div class="loading" id="loading">Loading question database…</div>

<div class="pointless" id="pointlessOverlay">
  <h2>Pointless!</h2>
  <p>A perfect answer</p>
  <small id="pointlessSub">Nobody said it. Click anywhere to continue.</small>
</div>

<script>
"use strict";

const state = {
  db: null,
  currentQ: null,
  answered: new Set(),   // accepted answer keys this round, to avoid duplicates
  round: [],             // { display, note, score, zero }
  animating: false,
};

/* ---------- Fuzzy matching ---------- */
function normalize(str) {
  return str
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "") // strip accents
    .replace(/[^a-z0-9 ]/g, " ")
    .replace(/\b(the|a|an|of|and|st|saint)\b/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function levenshtein(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let cur = [i];
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
    }
    prev = cur;
  }
  return prev[b.length];
}

// Return the best matching answer object, or null.
function fuzzyMatch(input, question) {
  const q = normalize(input);
  if (!q) return null;
  let best = null;
  let bestDist = Infinity;

  for (const ans of question.answers) {
    const candidates = [ans.answer, ...(ans.aliases || [])];
    for (const cand of candidates) {
      const c = normalize(cand);
      if (!c) continue;
      let dist;
      if (c === q) dist = 0;
      // any typed term contained in the answer (or vice-versa) counts, e.g. "monet" -> "Claude Monet".
      // require >= 3 chars so stray letters don't match everything.
      else if (q.length >= 3 && (c.includes(q) || q.includes(c))) dist = 1;
      else dist = levenshtein(q, c);

      // tolerance scales with length of the target word
      const tolerance = Math.max(1, Math.floor(c.length * 0.34));
      if (dist <= tolerance && dist < bestDist) {
        bestDist = dist;
        best = ans;
      }
    }
  }
  return best;
}

/* ---------- Countdown animation ---------- */
const RED = [226, 59, 59], ORANGE = [239, 138, 43], GREEN = [41, 196, 106], GOLD = [255, 225, 122];

function lerp(a, b, t) { return a + (b - a) * t; }
function mix(c1, c2, t) {
  return `rgb(${Math.round(lerp(c1[0], c2[0], t))},${Math.round(lerp(c1[1], c2[1], t))},${Math.round(lerp(c1[2], c2[2], t))})`;
}

// color from current value 100 -> 0: red -> orange -> green, and pure gold exactly at 0
function colorFor(value) {
  if (value <= 0.0001) return `rgb(${GOLD.join(",")})`;
  const v = Math.max(0, Math.min(100, value));
  if (v > 50) return mix(ORANGE, RED, (v - 50) / 50); // 100=red, 50=orange
  return mix(GREEN, ORANGE, v / 50);                  // 50=orange, 0=green
}

function setBoard(value, target) {
  const v = Math.max(0, value);
  document.getElementById("bigScore").textContent = Math.round(v);
  const fill = document.getElementById("barFill");
  fill.style.width = v + "%";
  fill.style.backgroundColor = colorFor(v);
}

// ease-out so it decelerates (slower as the number gets lower)
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function animateCountdown(target) {
  return new Promise((resolve) => {
    state.animating = true;
    const start = 100;
    // longer when the drop is bigger, so a low score feels suspenseful
    const duration = 1600 + (start - target) * 28; // ~1.6s .. ~4.4s
    let startTs = null;

    function frame(ts) {
      if (startTs === null) startTs = ts;
      const elapsed = ts - startTs;
      const t = Math.min(1, elapsed / duration);
      const eased = easeOutCubic(t);
      const value = start - (start - target) * eased;
      setBoard(value, target);

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        setBoard(target, target);
        // settle to gold if it's a low/zero score handled by caller
        state.animating = false;
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

/* ---------- Rendering ---------- */
function loadQuestion(q) {
  state.currentQ = q;
  state.answered = new Set();
  state.round = [];
  document.getElementById("qCat").textContent = q.category || "General Knowledge";
  document.getElementById("qText").textContent = q.question;
  document.getElementById("qSurvey").textContent = state.db.surveyNote || "";
  resetBoardVisual();
  renderLog();
  const input = document.getElementById("answerInput");
  input.value = "";
  input.disabled = false;
  input.focus();
  document.getElementById("statusLine").textContent = "Awaiting your answer";
  document.getElementById("verdict").innerHTML = "";
}

function resetBoardVisual() {
  setBoard(100, 100);
  document.getElementById("bigScore").textContent = "100";
}

function renderLog() {
  const log = document.getElementById("log");
  const total = state.round.reduce((s, e) => s + e.score, 0);
  document.getElementById("roundTotal").textContent = total;

  if (!state.round.length) {
    log.innerHTML = '<div class="empty">No answers yet.<br />The hunt for a pointless answer begins…</div>';
    return;
  }
  log.innerHTML = "";
  // newest first
  for (let i = state.round.length - 1; i >= 0; i--) {
    const e = state.round[i];
    const div = document.createElement("div");
    div.className = "entry" + (e.zero ? " zero" : "");
    div.innerHTML =
      '<div class="ans">' + escapeHtml(e.display) +
      (e.note ? '<small>' + escapeHtml(e.note) + '</small>' : '') +
      '</div><div class="pts">' + e.score + '</div>';
    log.appendChild(div);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- Submit flow ---------- */
async function submitAnswer() {
  if (state.animating) return;
  const input = document.getElementById("answerInput");
  const raw = input.value.trim();
  const verdict = document.getElementById("verdict");
  const status = document.getElementById("statusLine");
  if (!raw) return;

  const match = fuzzyMatch(raw, state.currentQ);

  if (!match) {
    // wrong / not on the board => maximum 100 (the worst), no animation drop
    setBoard(100, 100);
    verdict.innerHTML = '<span class="bad">✗ “' + escapeHtml(raw) + '” isn\'t on our board — that\'s the maximum 100.</span>';
    status.textContent = "Not on the board";
    flashScore();
    input.select();
    return;
  }

  if (state.answered.has(match.answer)) {
    verdict.innerHTML = '<span class="meh">“' + escapeHtml(match.answer) + '” is already on the board this round.</span>';
    status.textContent = "Already given";
    input.select();
    return;
  }

  // Accept it
  input.disabled = true;
  document.getElementById("submitBtn").disabled = true;
  status.textContent = "Counting down…";
  verdict.innerHTML = '<span class="accepted">✓ ' + escapeHtml(match.answer) + '</span>' +
    (match.note ? ' <span style="color:var(--muted)">— ' + escapeHtml(match.note) + '</span>' : '');

  await animateCountdown(match.score);

  // finalize colour: gold glow if a winning low score
  const fill = document.getElementById("barFill");
  if (match.score === 0) {
    fill.style.backgroundColor = `rgb(${GOLD.join(",")})`;
    document.getElementById("bigScore").style.filter = "drop-shadow(0 0 20px rgba(212,175,55,.7))";
    showPointless(match);
  } else {
    document.getElementById("bigScore").style.filter = "";
  }

  // record
  state.answered.add(match.answer);
  state.round.push({ display: match.answer, note: match.note || "", score: match.score, zero: match.score === 0 });
  renderLog();

  // verdict text by tier
  if (match.score === 0) {
    status.textContent = "POINTLESS!";
  } else if (match.score <= 15) {
    status.textContent = "Great answer";
    verdict.innerHTML += ' <span class="good">— a really low score!</span>';
  } else if (match.score <= 45) {
    status.textContent = "Solid";
    verdict.innerHTML += ' <span class="meh">— middling.</span>';
  } else {
    status.textContent = "Ouch";
    verdict.innerHTML += ' <span class="bad">— a high, popular answer.</span>';
  }

  // ready for next
  input.disabled = false;
  document.getElementById("submitBtn").disabled = false;
  input.value = "";
  input.focus();
}

function flashScore() {
  const el = document.getElementById("bigScore");
  el.style.transition = "none";
  el.style.color = "var(--red)";
  el.style.webkitTextFillColor = "var(--red)";
  setTimeout(() => {
    el.style.color = "";
    el.style.webkitTextFillColor = "";
    el.style.transition = "";
  }, 350);
}

function showPointless(match) {
  const overlay = document.getElementById("pointlessOverlay");
  document.getElementById("pointlessSub").textContent =
    (match.note ? match.note + " — n" : "N") + "obody said it. Click anywhere to continue.";
  overlay.classList.add("show");
}

/* ---------- Wiring ---------- */
function populateSelect() {
  const sel = document.getElementById("questionSelect");
  sel.innerHTML = "";
  state.db.questions.forEach((q, i) => {
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = (q.category ? q.category + " — " : "") +
      (q.question.length > 60 ? q.question.slice(0, 57) + "…" : q.question);
    sel.appendChild(opt);
  });
  sel.addEventListener("change", () => {
    loadQuestion(state.db.questions[Number(sel.value)]);
  });
}

function resetRound() {
  if (state.currentQ) loadQuestion(state.currentQ);
}

function wireEvents() {
  document.getElementById("submitBtn").addEventListener("click", submitAnswer);
  document.getElementById("answerInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); submitAnswer(); }
  });
  document.getElementById("resetBtn").addEventListener("click", resetRound);
  const overlay = document.getElementById("pointlessOverlay");
  overlay.addEventListener("click", () => overlay.classList.remove("show"));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") overlay.classList.remove("show");
  });
}

/* ---------- Boot ---------- */
async function boot() {
  try {
    const res = await fetch("database.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const db = await res.json();
    if (!db.questions || !db.questions.length) throw new Error("No questions in database.");
    state.db = db;

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display = "grid";
    populateSelect();
    wireEvents();
    loadQuestion(db.questions[0]);
  } catch (err) {
    const loading = document.getElementById("loading");
    loading.className = "errbox";
    loading.innerHTML =
      "<strong>Couldn't load <code>database.json</code></strong><br/><br/>" +
      escapeHtml(err.message) +
      "<br/><br/>This app loads its questions from a separate file, so it must be served over HTTP " +
      "(opening the file directly with <code>file://</code> blocks the fetch). Try:<br/><br/>" +
      "<code>python3 -m http.server</code><br/>then open <code>http://localhost:8000</code>.";
  }
}

boot();
</script>
</body>
</html>
